<style>
    .etsy-cta-section {
        display: flex;
        justify-content: center;

        margin: 30px 0;

    }

    .etsy-store-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #e28a9d;
        color: white;
        text-decoration: none;
        padding: 12px 25px;
        border-radius: 25px;
        gap: 10px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        position: relative;
        overflow: hidden;
    }

    .etsy-store-button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(120deg, transparent, rgba(255,255,255,0.3), transparent);
        transition: all 0.6s ease;
    }

    .etsy-store-button:hover::before {
        left: 100%;
    }

    .etsy-store-button:hover {
        background-color: #b1ebf6;
        color: #e28a9d;
        transform: translateY(-3px);
        box-shadow: 0 6px 8px rgba(0,0,0,0.15);
    }

    .etsy-icon {
        color: #b1ebf6;
        font-size: 1.5rem;
        transition: transform 0.3s ease;
    }

    .etsy-store-button:hover .etsy-icon {
        transform: scale(1.1) rotate(360deg);

    }

    @media (max-width: 768px) {
